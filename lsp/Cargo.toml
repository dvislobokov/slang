[package]
name = "zell-lsp"
version.workspace = true
edition.workspace = true
description = "Language server for Zell (LSP over stdio)"

[lib]
name = "zell_lsp"
path = "src/lib.rs"

[[bin]]
name = "zell-lsp"
path = "src/main.rs"

[dependencies]
zell = { path = "../compiler" }
lsp-server = "=0.7.8"
lsp-types = "=0.95.1"
serde_json = "1"
crossbeam-channel = "0.5"
serde = "1"
